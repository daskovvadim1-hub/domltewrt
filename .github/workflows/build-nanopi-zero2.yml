name: Build DOM LTE WRT — NanoPi Zero2

on:
  workflow_dispatch:
  push:
    branches:
      - nanopi-zero2-friendlywrt-test
    paths:
      - "docs/PORT-NANOPI-ZERO2.md"
      - "config/packages-nanopi-zero2.txt"
      - ".github/workflows/build-nanopi-zero2.yml"

permissions:
  contents: read

jobs:
  build-friendlywrt:
    name: Build DOM LTE WRT for NanoPi Zero2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential bzip2 ccache curl device-tree-compiler \
            file flex gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            python3-pyelftools rsync subversion swig time unzip wget xsltproc zlib1g-dev \
            libelf-dev libgmp3-dev libmpc-dev libmpfr-dev

      - name: Checkout DOM LTE WRT overlay
        uses: actions/checkout@v4
        with:
          ref: nanopi-zero2-friendlywrt-test

      - name: Restore RK3528 compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: domlte-rk3528-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            domlte-rk3528-ccache-${{ runner.os }}-

      - name: Prepare compiler cache
        run: |
          mkdir -p "$HOME/.cache/ccache"
          ccache --set-config=max_size=5G
          ccache --show-stats

      - name: Fetch FriendlyWrt RK3528 sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p friendlywrt25-rk3528
          cd friendlywrt25-rk3528
          git clone https://github.com/friendlyarm/repo --depth 1 tools
          tools/repo init -u https://github.com/friendlyarm/friendlywrt_manifests \
            -b master-v25.12 -m rk3528.xml \
            --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
          tools/repo sync -c --no-clone-bundle

      - name: Add Fibocom XMM feeds and package selection
        shell: bash
        run: |
          set -euxo pipefail
          cd friendlywrt25-rk3528/friendlywrt
          # Keep only the required modem packages; do not register the entire modemfeed.
          sed -i '/^src-git modemfeed /d; /^src-git modem5g /d' feeds.conf.default
          mkdir -p package/dom-lte
          git clone --filter=blob:none https://github.com/koshev-msk/modemfeed.git "$RUNNER_TEMP/modemfeed"
          git -C "$RUNNER_TEMP/modemfeed" fetch --depth 1 origin 04761d9c5ef20c95e6eca6312f3af5b83a92b932
          git -C "$RUNNER_TEMP/modemfeed" checkout --detach FETCH_HEAD
          cp -a "$RUNNER_TEMP/modemfeed/packages/net/xmm-modem" package/dom-lte/
          cp -a "$RUNNER_TEMP/modemfeed/luci/protocols/luci-proto-xmm" package/dom-lte/
          git clone --filter=blob:none https://github.com/fildunsky/luci-app-5gmodem.git "$RUNNER_TEMP/luci-app-5gmodem"
          git -C "$RUNNER_TEMP/luci-app-5gmodem" fetch --depth 1 origin 129d077accf0a3309ab14704d369da51b7939382
          git -C "$RUNNER_TEMP/luci-app-5gmodem" checkout --detach FETCH_HEAD
          cp -a "$RUNNER_TEMP/luci-app-5gmodem/luci-app-5gmodem" package/dom-lte/
          test -s package/dom-lte/xmm-modem/Makefile
          test -s package/dom-lte/luci-proto-xmm/Makefile
          test -s package/dom-lte/luci-app-5gmodem/Makefile
          # ALL_NONSHARED selects unrelated SSW/PPPoE packages and creates a Kconfig cycle.
          sed -i '/^CONFIG_ALL_NONSHARED=y$/d' ../configs/rockchip/01-nanopi

          mkdir -p ../configs/rockchip
          cat > ../configs/rockchip/06-dom-lte <<'EOF'
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_picocom=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-5gmodem=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-config-ru=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_luci-i18n-adblock-ru=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_luci-proto-xmm=y
          CONFIG_PACKAGE_xmm-modem=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-tun=y
          # Docker is intentionally excluded from the NanoPi firmware.
          # CONFIG_PACKAGE_dockerd is not set
          # CONFIG_PACKAGE_luci-app-dockerman is not set
          # CONFIG_PACKAGE_containerd is not set
          # CONFIG_PACKAGE_docker-compose is not set
          # Avoid unrelated package selections.
          # CONFIG_PACKAGE_luci-app-rp-pppoe-server is not set
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/home/runner/.cache/ccache"
          # Fibocom XMM uses NCM/serial; exclude the unrelated SSW dual-SIM stack.
          # luci-app-5gmodem requires modemmanager, so keep that dependency enabled.
          # CONFIG_PACKAGE_luci-app-ssw is not set
          # CONFIG_PACKAGE_ssw is not set
          EOF

      - name: Disable unrelated Realtek and USB Wi-Fi driver builds
        shell: bash
        run: |
          set -euxo pipefail
          cd friendlywrt25-rk3528
          SD_FUSE_BUILD_KERNEL="$(find . -path '*/scripts/sd-fuse/build-kernel.sh' -print -quit)"
          test -n "$SD_FUSE_BUILD_KERNEL"
          python3 - "$SD_FUSE_BUILD_KERNEL" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          start = "    # build rtw_8822ce wifi driver"
          end = "    # build usb wifi driver"
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit("Could not identify the exact upstream rtw88 block; refusing to patch")
          a = s.index(start)
          b = s.index(end, a)
          p.write_text(s[:a] + "    # rtw88 intentionally omitted: no external Realtek Wi-Fi adapter is required.\n\n" + s[b:])
          PY

      - name: Enforce required modules in FriendlyELEC 6.1 kernel
        shell: bash
        run: |
          set -euxo pipefail
          DEFCONFIG="$GITHUB_WORKSPACE/friendlywrt25-rk3528/kernel/arch/arm64/configs/nanopi5_linux_defconfig"
          test -f "$DEFCONFIG"
          python3 - "$DEFCONFIG" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          required = {
              "CONFIG_USB_SERIAL": "y",
              "CONFIG_USB_SERIAL_OPTION": "m",
              "CONFIG_USB_ACM": "y",
              "CONFIG_USB_NET_CDC_NCM": "m",
              "CONFIG_USB_NET_RNDIS_HOST": "y",
              "CONFIG_TUN": "m",
              "CONFIG_NF_TPROXY": "m",
              "CONFIG_NF_SOCKET": "m",
              "CONFIG_NFT_TPROXY": "m",
              "CONFIG_NFT_SOCKET": "m",
          }
          for key, value in required.items():
              pattern = rf"^(?:# )?{re.escape(key)}(?:=.*| is not set)$"
              replacement = f"{key}={value}"
              if re.search(pattern, s, flags=re.M):
                  s = re.sub(pattern, replacement, s, flags=re.M)
              else:
                  s += f"\n{replacement}\n"
          p.write_text(s)
          print("Enforced FriendlyELEC kernel options:")
          for key, value in required.items():
              print(f"{key}={value}")
          PY

      - name: Configure Git identity for upstream patching
        run: |
          git config --global user.name "DOM LTE WRT Builder"
          git config --global user.email "dom-lte-wrt-builder@users.noreply.github.com"

      - name: Build FriendlyWrt for NanoPi Zero2
        shell: bash
        run: |
          set -euxo pipefail
          cd friendlywrt25-rk3528
          MK_SCRIPT="$GITHUB_WORKSPACE/friendlywrt25-rk3528/scripts/mk-friendlywrt.sh"
          test -s "$MK_SCRIPT"
          python3 - "$MK_SCRIPT" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = "make -j$(nproc)\\nRET=$?\\nif [ $RET -eq 0 ]; then\\n\\texit 0\\nfi\\n\\nmake -j1 V=s\\nRET=$?\\nif [ $RET -eq 0 ]; then\\n\\texit 0\\nfi\\n\\nexit 1"
          new = "if make -j2; then\\n\\texit 0\\nfi\\necho \\"Parallel build failed; retrying serially with verbose output.\\"\\nmake -j1 V=s"
          if old not in s:
              raise SystemExit("Could not find the exact upstream build fallback; refusing to patch")
          updated = s.replace(old, new, 1)
                    p.write_text(updated)
          print("Patched upstream FriendlyWrt build: -j2 with a reachable -j1 V=s fallback")
          PY
          if BUILD_THIRD_PARTY_DRIVER=0 ./build.sh rk3528.mk; then
            echo "FriendlyWrt build completed."
          else
            build_rc=$?
            echo "Full build failed (exit $build_rc); collecting focused verbose liblzo diagnostics."
            set +e
            make -C friendlywrt tools/liblzo/compile V=s -j1 2>&1 | tee "$GITHUB_WORKSPACE/liblzo-diagnostic.log"
            diagnostic_rc=${PIPESTATUS[0]}
            set -e
            {
              echo "### FriendlyWrt build failed"
              echo "- Full build exit code: $build_rc"
              echo "- Focused liblzo diagnostic exit code: $diagnostic_rc"
              echo "- See the liblzo-diagnostic artifact for compiler output."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_rc"
          fi

      - name: Upload focused liblzo diagnostic
        if: always() && hashFiles('liblzo-diagnostic.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: liblzo-diagnostic
          path: liblzo-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report and save compiler cache
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save RK3528 compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: domlte-rk3528-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install modem panels and PassWall 2 into the image rootfs
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$GITHUB_WORKSPACE/friendlywrt25-rk3528/friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
          test -x "$ROOTFS/sbin/apk"
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64
          sudo install -D /usr/bin/qemu-aarch64-static "$ROOTFS/usr/bin/qemu-aarch64-static"

          sudo install -d "$ROOTFS/etc/apk/keys" "$ROOTFS/etc/apk/repositories.d"
          curl -fsSL https://raw.githubusercontent.com/4IceG/Modem-extras-apk/main/myapk/IceG-apkpub.pem \
            -o "$ROOTFS/etc/apk/keys/IceG-apkpub.pem"
          curl -fL --retry 3 https://downloads.sourceforge.net/project/openwrt-passwall-build/apk.pub \
            -o "$ROOTFS/etc/apk/keys/passwall.pub"

          cat | sudo tee "$ROOTFS/etc/apk/repositories.d/dom-lte.list" >/dev/null <<'EOF'
          https://raw.githubusercontent.com/4IceG/Modem-extras-apk/main/myapk/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/aarch64_generic/passwall_packages/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/aarch64_generic/passwall_luci/packages.adb
          https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/aarch64_generic/passwall2/packages.adb
          EOF

          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sys "$ROOTFS/sys"
          cleanup() {
            sudo umount "$ROOTFS/sys" || true
            sudo umount "$ROOTFS/proc" || true
            sudo umount "$ROOTFS/dev" || true
          }
          trap cleanup EXIT

          sudo chroot "$ROOTFS" /sbin/apk update
          sudo chroot "$ROOTFS" /sbin/apk add --no-cache \
            luci-app-3ginfo-lite luci-i18n-3ginfo-lite-ru \
            luci-app-modemdata modemdata luci-i18n-modemdata-ru \
            luci-app-modemband modemband luci-i18n-modemband-ru \
            luci-app-sms-tool-js luci-i18n-sms-tool-js-ru \
            luci-app-passwall2 luci-i18n-passwall2-ru \
            xray-core sing-box v2ray-geoip v2ray-geosite geoview tcping

          sudo rm -f "$ROOTFS/usr/bin/qemu-aarch64-static"
          sudo tee -a "$ROOTFS/etc/sysctl.conf" >/dev/null <<'EOF'
          # DOM LTE WRT: IPv6 remains compiled in but is disabled by default.
          net.ipv6.conf.all.disable_ipv6=1
          net.ipv6.conf.default.disable_ipv6=1
          EOF
          sudo install -d "$ROOTFS/etc/config"
          sudo tee "$ROOTFS/etc/config/luci" >/dev/null <<'EOF'
          config core 'main'
              option lang 'auto'
              option mediaurlbase '/luci-static/argon'
          EOF

          for package in luci-app-5gmodem luci-proto-xmm xmm-modem luci-app-passwall2 \
            luci-app-3ginfo-lite luci-app-modemdata luci-app-modemband \
            luci-i18n-modemband-ru luci-app-sms-tool-js; do
            sudo chroot "$ROOTFS" /sbin/apk info -e "$package"
          done

          for package in dockerd luci-app-dockerman containerd docker-compose; do
            if sudo chroot "$ROOTFS" /sbin/apk info -e "$package" >/dev/null 2>&1; then
              echo "ERROR: Docker package unexpectedly present: $package" >&2
              exit 1
            fi
          done

      - name: Package bootable SD and eMMC images
        shell: bash
        run: |
          set -euxo pipefail
          cd friendlywrt25-rk3528
          ./build.sh sd-img
          ./build.sh emmc-img
          mkdir -p ../output
          find -L out -type f \\( -iname '*.img' -o -iname '*.img.gz' -o -iname '*.raw' -o -iname '*.raw.gz' -o -iname '*.tgz' -o -iname '*.zip' \\) -size +1M -exec cp --parents {} ../output/ \\;
          test -n "$(find ../output -type f -print -quit)"

      - name: Verify firmware contents and FriendlyELEC kernel ABI
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="friendlywrt25-rk3528/friendlywrt/build_dir/target-aarch64_generic_musl/root-rockchip"
          MODULES="$ROOTFS/lib/modules/6.1.141"
          test -d "$MODULES"
          grep -q '^CONFIG_USB_SERIAL_OPTION=m$' friendlywrt25-rk3528/kernel/.config
          test -s "$MODULES/option.ko"
          for module in cdc_ncm tun nft_tproxy nft_socket nf_tproxy_ipv4 nf_socket_ipv4; do
            test -s "$MODULES/$module.ko"
          done
          sudo apt-get update
          sudo apt-get install -y kmod
          test "$(modinfo -F vermagic "$MODULES/option.ko" | awk '{print $1}')" = "6.1.141"
          grep -q "mediaurlbase '/luci-static/argon'" "$ROOTFS/etc/config/luci"
          grep -q 'net.ipv6.conf.all.disable_ipv6=1' "$ROOTFS/etc/sysctl.conf"
          test -d "$ROOTFS/www/luci-static/argon"
          test -d "$ROOTFS/usr/lib/lua/luci/proto"
          echo "Kernel modules and rootfs checks passed."

      - name: Upload DOM LTE WRT SD and eMMC images
        uses: actions/upload-artifact@v4
        with:
          name: dom-lte-wrt-nanopi-zero2-sd-and-emmc
          path: output/
          if-no-files-found: error
          retention-days: 14
