name: Build DOM LTE WRT

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "files/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  validate-modem-feeds:
    name: Validate XMM and modem UI feeds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify 132lan and 4IceG feeds
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            alpine:3.24 \
            sh scripts/validate-modem-feeds.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download official OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          URL="https://downloads.openwrt.org/releases/25.12.6/targets/x86/legacy/openwrt-imagebuilder-25.12.6-x86-legacy.Linux-x86_64.tar.zst"
          SHA="5aa4348e026bd729dc54ca7f4f3f46ab7ed0d38a52beafd02d27cebca34ed2ef"
          curl -fL "$URL" -o imagebuilder.tar.zst
          echo "$SHA  imagebuilder.tar.zst" | sha256sum -c -
          mkdir imagebuilder
          tar --zstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: Bundle Argon theme and Russian translation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/tmp/argon
          curl -fL --retry 3 \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v3.1.3/luci-theme-argon-3.1.3-r1.apk" \
            -o files/tmp/argon/luci-theme-argon-3.1.3-r1.apk
          curl -fL --retry 3 \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v3.1.3/luci-i18n-argon-config-ru-3.1.3-r1.apk" \
            -o files/tmp/argon/luci-i18n-argon-config-ru-3.1.3-r1.apk
          cd files/tmp/argon
          echo "75d6960715b10d96a38d55c05a57d437948de4701c313d9fa13ea37b2787bce3  luci-theme-argon-3.1.3-r1.apk" | sha256sum -c -
          echo "3eb3d9ac66a6b83d3191b645d2daf541123e9c4d40c2806061843abf5dcc5777  luci-i18n-argon-config-ru-3.1.3-r1.apk" | sha256sum -c -

      - name: Configure signed modem feeds for ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          cd imagebuilder

          # ImageBuilder's host-side apk resolver reads trusted keys from TOPDIR/keys.
          mkdir -p keys
          curl -fL --retry 3 \
            "https://openwrt.132lan.ru/packages/25.12/packages/repo.pem" \
            -o keys/132lan-repo.pub
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/4IceG/Modem-extras-apk/main/myapk/IceG-apkpub.pem" \
            -o keys/IceG-apkpub.pub
          curl -fL --retry 3 \
            "https://downloads.sourceforge.net/project/openwrt-passwall-build/apk.pub" \
            -o keys/passwall.pub

          openssl pkey -pubin -in keys/132lan-repo.pub -noout
          openssl pkey -pubin -in keys/IceG-apkpub.pub -noout
          openssl pkey -pubin -in keys/passwall.pub -noout

          # The APK-based ImageBuilder uses TOPDIR/repositories (not repositories.conf).
          test -f repositories
          grep -qF "https://openwrt.132lan.ru/packages/25.12/packages/x86_64/modemfeed/packages.adb" repositories || \
            echo "https://openwrt.132lan.ru/packages/25.12/packages/x86_64/modemfeed/packages.adb" >> repositories
          grep -qF "https://raw.githubusercontent.com/4IceG/Modem-extras-apk/main/myapk/packages.adb" repositories || \
            echo "https://raw.githubusercontent.com/4IceG/Modem-extras-apk/main/myapk/packages.adb" >> repositories

          for feed in passwall_packages passwall_luci passwall2; do
            URL="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-25.12/x86_64/$feed/packages.adb"
            grep -qF "$URL" repositories || echo "$URL" >> repositories
          done

      - name: Build ext4 image for Legacy BIOS
        shell: bash
        run: |
          set -euo pipefail
          cd imagebuilder
          PACKAGES="$(grep -Ev '^[[:space:]]*(#|$)' ../config/packages.txt | tr '\n' ' ')"
          make info
          chmod +x ../files/etc/uci-defaults/99-dom-lte-wrt-branding
          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="../files"

          MANIFEST="$(find bin/targets -type f -name '*.manifest' -print -quit)"
          test -n "$MANIFEST"
          for pkg in luci-proto-xmm luci-app-modemdata modemdata luci-app-modemband luci-app-sms-tool-js luci-i18n-modemdata-ru luci-i18n-modemband-ru luci-i18n-sms-tool-js-ru luci-app-passwall2 luci-i18n-passwall2-ru xray-core sing-box v2ray-geoip v2ray-geosite kmod-nft-tproxy kmod-nft-socket kmod-tun; do
            if ! grep -Eq "^$pkg -" "$MANIFEST"; then
              echo "ERROR: required modem package missing from final image: $pkg" >&2
              exit 1
            fi
          done
          echo "PASS: all required XMM and modem UI packages are in the image manifest"

      - name: Collect image and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find imagebuilder/bin/targets -type f \( -name '*ext4-combined.img.gz' -o -name '*.manifest' \) -exec cp {} output/ \;
          test -n "$(find output -type f -name '*ext4-combined.img.gz' -print -quit)"
          cp config/packages.txt output/packages-requested.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: dom-lte-wrt-x86-legacy-ext4
          path: output/
          if-no-files-found: error
          retention-days: 14
