name: Inspect official FriendlyWrt 25.12 image — NanoPi Zero2

on:
  push:
    branches:
      - nanopi-zero2-friendlywrt-test
    paths:
      - ".github/workflows/inspect-friendlywrt-image.yml"
      - "docs/FRIENDLYWRT-25.12-TEST-PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download pinned FriendlyELEC non-Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-work report
          cd image-work
          URL="https://github.com/friendlyarm/Actions-FriendlyWrt/releases/download/FriendlyWrt-2026-10-13/R28S-Zero2-NEO3Plus-Series-FriendlyWrt-25.12.img.gz"
          curl -fL --retry 3 "$URL" -o friendlywrt.img.gz
          echo "0724d870ff5750d99093d535f8386ea24b22bc5567e9ef7c17ad034bbb829cac  friendlywrt.img.gz" | sha256sum -c -
          gzip -t friendlywrt.img.gz
          sha256sum friendlywrt.img.gz | tee ../report/image-sha256.txt
          stat -c 'compressed_bytes=%s' friendlywrt.img.gz | tee ../report/image-size.txt
          gzip -dc friendlywrt.img.gz > friendlywrt.img
          sha256sum friendlywrt.img | tee ../report/raw-image-sha256.txt
          file friendlywrt.img | tee ../report/image-file.txt
          sudo losetup --find --show --partscan friendlywrt.img | tee ../report/loop-device.txt

      - name: Inspect partitions and extract read-only rootfs metadata
        shell: bash
        run: |
          set -euo pipefail
          LOOP="$(cat report/loop-device.txt)"
          cleanup() {
            if [ -n "${MOUNTED:-}" ]; then sudo umount "$MOUNTED" || true; fi
            sudo losetup -d "$LOOP" || true
          }
          trap cleanup EXIT
          sudo lsblk -o NAME,SIZE,FSTYPE,LABEL,PARTLABEL,PARTUUID "$LOOP" | tee report/partitions.txt
          mkdir -p inspect-root
          FOUND=0
          while read -r PART FSTYPE; do
            [ -n "$FSTYPE" ] || continue
            case "$FSTYPE" in
              ext4|squashfs)
                if [ "$FSTYPE" = "ext4" ]; then OPTS="ro,noload"; else OPTS="ro"; fi
                if sudo mount -o "$OPTS" "$PART" inspect-root 2>/dev/null; then
                  if [ -f inspect-root/etc/openwrt_release ] || [ -f inspect-root/etc/apk/arch ]; then
                    FOUND=1
                    MOUNTED=inspect-root
                    echo "rootfs_partition=$PART" | tee report/rootfs-location.txt
                    [ ! -f inspect-root/etc/openwrt_release ] || cp inspect-root/etc/openwrt_release report/openwrt_release.txt
                    [ ! -f inspect-root/etc/apk/arch ] || cp inspect-root/etc/apk/arch report/apk-arch.txt
                    [ ! -f inspect-root/etc/apk/repositories ] || cp inspect-root/etc/apk/repositories report/apk-repositories.txt
                    [ ! -f inspect-root/etc/apk/repositories.d/dom-lte.list ] || cp inspect-root/etc/apk/repositories.d/dom-lte.list report/existing-extra-repositories.txt

                    # Capture actual module directory entries, symlinks and files.
                    if [ -e inspect-root/lib/modules ] || [ -L inspect-root/lib/modules ]; then
                      ls -la inspect-root/lib/modules > report/kernel-module-directory.txt 2>&1 || true
                      readlink -f inspect-root/lib/modules > report/kernel-module-directory-realpath.txt 2>&1 || true
                      find inspect-root/lib/modules -mindepth 1 -maxdepth 2 -printf '%y %p -> %l\n' 2>/dev/null | sort > report/kernel-module-tree.txt || true
                      find -L inspect-root/lib/modules -type f \( -name '*.ko' -o -name '*.ko.*' -o -name 'modules.dep' -o -name 'modules.alias' \) -printf '%P\n' 2>/dev/null | head -n 500 > report/kernel-module-files.txt || true
                    fi

                    if [ -f inspect-root/lib/apk/db/installed ]; then
                      cp inspect-root/lib/apk/db/installed report/apk-installed-db.txt
                      awk '/^P:kernel$/{p=1} p{print} p && /^$/{exit}' inspect-root/lib/apk/db/installed > report/kernel-apk-record.txt
                      awk '/^P:kmod-/{p=1} p{print} p && /^$/{p=0}' inspect-root/lib/apk/db/installed | grep -E '^(P:|V:|D:)' > report/kmod-package-abi-summary.txt || true
                      grep -E '^P:(dockerd|luci-app-dockerman|containerd|docker-compose)$' inspect-root/lib/apk/db/installed > report/docker-packages.txt || true
                    fi

                    if [ -d inspect-root/etc/apk ]; then
                      find inspect-root/etc/apk -maxdepth 3 -type f -printf '%P\n' | sort > report/apk-config-files.txt
                      find inspect-root/etc/apk -maxdepth 3 -type f \( -name '*repositories*' -o -name '*.list' \) -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; > report/apk-repositories-content.txt 2>&1 || true
                    fi
                    find inspect-root/etc -maxdepth 2 -type f \( -name '*release*' -o -name 'os-release' -o -path '*/apk/arch' \) -print > report/os-metadata-files.txt
                    sudo umount inspect-root
                    MOUNTED=""
                    break
                  fi
                  sudo umount inspect-root
                fi
                ;;
            esac
          done < <(sudo lsblk -lnpo NAME,FSTYPE "$LOOP" | tail -n +2)
          if [ "$FOUND" -ne 1 ]; then
            echo "Could not identify mounted FriendlyWrt root filesystem or APK metadata." >&2
            exit 1
          fi
          {
            echo "### Official FriendlyWrt image inspection"
            echo "- Image: R28S-Zero2-NEO3Plus-Series-FriendlyWrt-25.12.img.gz"
            echo "- Release: FriendlyWrt-2026-10-13"
            echo "- Root filesystem mounted read-only; no physical media accessed."
            echo "- Kernel APK record, module directory tree and package ABI summary attached."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload offline inspection report
        uses: actions/upload-artifact@v4
        with:
          name: friendlywrt-25.12-official-image-inspection
          path: report/
          if-no-files-found: error
          retention-days: 30
