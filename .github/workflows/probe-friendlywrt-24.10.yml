name: Probe FriendlyWrt 24.10 base image

on:
  push:
    branches:
      - prebuilt-friendlywrt
    paths:
      - .github/workflows/probe-friendlywrt-24.10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs fdisk gzip

      - name: Download and inspect official FriendlyWrt 24.10 image
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://github.com/friendlyarm/Actions-FriendlyWrt/releases/download/FriendlyWrt-2026-10-13/R28S-Zero2-NEO3Plus-Series-FriendlyWrt-24.10.img.gz"
          curl -fL --retry 3 "$URL" -o friendlywrt-24.10.img.gz
          gzip -t friendlywrt-24.10.img.gz
          sha256sum friendlywrt-24.10.img.gz | tee image-sha256.txt
          gzip -dc friendlywrt-24.10.img.gz > friendlywrt-24.10.img
          sudo fdisk -l friendlywrt-24.10.img | tee image-partitions.txt
          LOOP="$(sudo losetup --find --show --partscan "$PWD/friendlywrt-24.10.img")"
          cleanup() {
            sudo umount /mnt/friendlywrt-24.10-probe 2>/dev/null || true
            sudo losetup -d "$LOOP" || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          sudo mkdir -p /mnt/friendlywrt-24.10-probe
          : > rootfs-slots.txt
          while read -r PART; do
            [ "$PART" = "$LOOP" ] && continue
            [ -b "$PART" ] || continue
            if sudo mount -t ext4 -o ro,noload "$PART" /mnt/friendlywrt-24.10-probe 2>/dev/null; then
              if [ -f /mnt/friendlywrt-24.10-probe/etc/opkg/distfeeds.conf ]; then
                sudo cp /mnt/friendlywrt-24.10-probe/etc/opkg/distfeeds.conf ./distfeeds.conf
              fi
              if [ -f /mnt/friendlywrt-24.10-probe/etc/openwrt_release ]; then
                {
                  echo "===== $PART ====="
                  cat /mnt/friendlywrt-24.10-probe/etc/openwrt_release
                  echo "module directories:"
                  find /mnt/friendlywrt-24.10-probe/lib/modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null || true
                  echo "Package manager binaries:"
                  for candidate in /sbin/apk /usr/bin/apk /bin/apk /usr/sbin/apk /bin/opkg /sbin/opkg /usr/bin/opkg /usr/sbin/opkg; do
                    if [ -x "/mnt/friendlywrt-24.10-probe$candidate" ]; then ls -l "/mnt/friendlywrt-24.10-probe$candidate"; fi
                  done
                  echo "opkg configuration:"
                  if [ -d /mnt/friendlywrt-24.10-probe/etc/opkg ]; then
                    find /mnt/friendlywrt-24.10-probe/etc/opkg -maxdepth 2 -type f -print
                    grep -RhsE '^(src|src/gz|option)' /mnt/friendlywrt-24.10-probe/etc/opkg 2>/dev/null || true
                  else
                    echo "NO /etc/opkg"
                  fi
                  echo "apk configuration:"
                  if [ -d /mnt/friendlywrt-24.10-probe/etc/apk ]; then
                    grep -RhsE '^(https?://|file://)' /mnt/friendlywrt-24.10-probe/etc/apk 2>/dev/null || true
                  else
                    echo "NO /etc/apk"
                  fi
                  echo "Fibocom-relevant kernel modules:"
                  find /mnt/friendlywrt-24.10-probe/lib/modules -type f 2>/dev/null | grep -Ei '/(cdc_acm|cdc_ncm|cdc_ether|rndis_host|usbnet|usbserial|usb_wwan|option|qmi_wwan|cdc_mbim|cdc_wdm|mii|usbcore|usb_common|tun|nft_tproxy|nft_socket)\.ko(\.|$)' | sort || true
                  echo "Installed relevant kmod packages:"
                  if [ -f /mnt/friendlywrt-24.10-probe/usr/lib/opkg/status ]; then
                    grep -E -A4 '^Package: kmod-(usb|nft|tun)' /mnt/friendlywrt-24.10-probe/usr/lib/opkg/status || true
                  fi
                  echo "Local package candidates:"
                  find /mnt/friendlywrt-24.10-probe/usr/local/packages -maxdepth 1 -type f \\( -name '*kmod-usb*' -o -name '*kmod-nft*' -o -name '*kmod-tun*' -o -name 'kernel-*' \\) -printf '%f\\n' 2>/dev/null | sort || true
                  echo "kernel module files (first 40):"
                  find /mnt/friendlywrt-24.10-probe/lib/modules -maxdepth 3 -type f 2>/dev/null | head -40 || true
                } | tee -a rootfs-slots.txt
              fi
              sudo umount /mnt/friendlywrt-24.10-probe
            fi
          done < <(sudo lsblk -lnpo NAME "$LOOP")
          cat rootfs-slots.txt >> "$GITHUB_STEP_SUMMARY"
          # Probe configured opkg feeds for exact USB modem modules and report
          # package kernel dependencies instead of assuming that package names match.
          : > opkg-feed-probe.txt
          if [ -f distfeeds.conf ]; then
            while read -r KIND NAME URL REST; do
              case "$KIND" in src|src/gz) ;; *) continue ;; esac
              [ -n "$URL" ] || continue
              BASE="${URL%/}"
              echo "===== $NAME $BASE =====" | tee -a opkg-feed-probe.txt
              for INDEX in Packages.gz Packages; do
                TMP="feed-${NAME}-${INDEX//./_}"
                if curl -fLsS --max-time 30 "$BASE/$INDEX" -o "$TMP"; then
                  if [[ "$INDEX" == *.gz ]]; then
                    gzip -dc "$TMP" >> "feed-${NAME}.txt"
                  else
                    cat "$TMP" >> "feed-${NAME}.txt"
                  fi
                  break
                fi
              done
              if [ -f "feed-${NAME}.txt" ]; then
                awk 'BEGIN{RS="";FS="\\n"} /Package: (kmod-usb-acm|kmod-usb-net-cdc-ncm|kmod-usb-net-rndis|kmod-usb-serial|kmod-usb-serial-option|kmod-usb-serial-wwan|kmod-usb-net-cdc-ether)/ {print $0 "\\n"}' "feed-${NAME}.txt" | tee -a opkg-feed-probe.txt
              else
                echo "INDEX_UNAVAILABLE" | tee -a opkg-feed-probe.txt
              fi
            done < distfeeds.conf
          else
            echo "NO_DISTFEEDS_CONF" | tee -a opkg-feed-probe.txt
          fi
          cat opkg-feed-probe.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload 24.10 compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friendlywrt-24.10-compatibility-report
          path: |
            image-sha256.txt
            image-partitions.txt
            rootfs-slots.txt
            opkg-feed-probe.txt
            feed-*.txt
          if-no-files-found: ignore
          retention-days: 7
